name: Backend regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research_artifacts/processed/backend-validation-requirements-2026-11-12.txt
      - name: Install CPU-only Torch for the pinned test environment
        run: python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu
      - name: Install the captured validation environment
        run: |
          python -m pip install --no-deps -r research_artifacts/processed/backend-validation-requirements-2026-11-12.txt
          python -m pip check
      - name: Run complete backend regression suite
        working-directory: Clarion-Backend
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_backend_tests.py -vv
